<div style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;">
    <canvas id="canvas" width="300" height="300"></canvas>
</div>
<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const data = [{ n: "A", x: 0, y: 0 }, { n: "B", x: 100, y: 0 }, { n: "C", x: 0, y: 100 }, { n: "D", x: 200, y: 150 }, { n: "E", x: 275, y: 280 }];
    canvas.style.border = "1px solid black";
    canvas.style.padding = "75px";

    //Border


    const squares=8;
    const squareSize=300/squares;
    for (let i=0; i<squares; i++){
        for (let j=0; j<squares; j++){
            if ((i+j)%2==0){
                ctx.fillStyle = "white";
            } else {
                ctx.fillStyle = "brown";
            }
            ctx.fillRect(i*squareSize, j*squareSize, squareSize, squareSize);
        }
    }

    ctx.beginPath();
    ctx.strokeStyle = 'black';
    ctx.lineWidth = "1px";
    ctx.rect(0, 0, 300, 300);
    ctx.stroke();
</script>
