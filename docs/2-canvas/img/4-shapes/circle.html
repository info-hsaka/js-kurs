<div style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;">
    <canvas id="canvas" width="300" height="300"></canvas>
</div>
<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const data = [{ n: "A", x: 0, y: 0 }, { n: "B", x: 100, y: 0 }, { n: "C", x: 0, y: 100 }, { n: "D", x: 200, y: 150 }, { n: "E", x: 275, y: 280 }];
    canvas.style.border = "1px solid black";
    canvas.style.padding = "75px";


    function convertToRadians(degree) {
            return degree * (Math.PI / 180);
    }

    //Border
    ctx.beginPath();
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 1;
    ctx.rect(0, 0, 300, 300);
    ctx.stroke();

    
    ctx.fillStyle = "red";
    ctx.strokeStyle = "green";
    ctx.lineWidth = 40;

    ctx.beginPath();
    ctx.arc(150, 150, 100, 0, 2 * Math.PI);
    ctx.fill();    // Erst füllen
    ctx.stroke();  // Dann Rand zeichnen
